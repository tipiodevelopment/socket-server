name: Deploy socket-server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options: [development, staging, production]

permissions:
  id-token: write
  contents: read

env:
  ACR_REGISTRY: reachuprod2.azurecr.io
  IMAGE_NAME: socket-server
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: "Deploy → ${{ github.event.inputs.environment || 'development' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set target environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment || 'development' }}"
          echo "name=$ENV" >> $GITHUB_OUTPUT
          echo "rg=rg-socket-server-$ENV" >> $GITHUB_OUTPUT
          echo "app=ca-socket-server-$ENV" >> $GITHUB_OUTPUT
          echo "tag=$ENV-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name reachuprod2

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.name }}-latest

      - name: Run DB migrations (Container Apps Job)
        run: |
          JOB_NAME="migrate-$(echo ${{ github.sha }} | head -c 8)"
          IDENTITY_ID=$(az identity show \
            --name "id-socket-server-${{ steps.env.outputs.name }}" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --query id -o tsv)

          az containerapp job create \
            --name "$JOB_NAME" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --environment "cae-socket-server-${{ steps.env.outputs.name }}" \
            --image "${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}" \
            --cpu 0.5 --memory 1Gi \
            --registry-server ${{ env.ACR_REGISTRY }} \
            --registry-identity "$IDENTITY_ID" \
            --mi-user-assigned "$IDENTITY_ID" \
            --replica-timeout 300 \
            --replica-completion-count 1 \
            --command "npx" "drizzle-kit" "push" 2>&1 || true

          # Wait for job to finish
          for i in $(seq 1 20); do
            STATUS=$(az containerapp job execution list \
              --name "$JOB_NAME" \
              --resource-group "${{ steps.env.outputs.rg }}" \
              --query "[0].properties.status" -o tsv 2>/dev/null)
            echo "Migration job status: $STATUS"
            [ "$STATUS" = "Succeeded" ] && break
            [ "$STATUS" = "Failed" ] && echo "Migration failed" && exit 1
            sleep 15
          done

          az containerapp job delete \
            --name "$JOB_NAME" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --yes 2>/dev/null || true

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "${{ steps.env.outputs.app }}" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --image "${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}"

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ socket-server desplegado en ${{ steps.env.outputs.name }}%0ACommit: ${{ github.sha }}%0APor: ${{ github.actor }}"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Deploy FALLÓ en ${{ steps.env.outputs.name }}%0ACommit: ${{ github.sha }}%0ALogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
