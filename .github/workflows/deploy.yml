name: Deploy to Azure AKS

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit push

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: reachuqa2.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: reachuqa2.azurecr.io/socket-server:latest
          build-args: |
            SV_APP_ID=${{ secrets.SV_APP_ID }}
            SV_PASSWORD=${{ secrets.SV_PASSWORD }}
            SV_TENANT_ID=${{ secrets.SV_TENANT_ID }}
            AZ_STORAGE=${{ secrets.AZ_STORAGE }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --name kubernetesqa \
            --resource-group qa \
            --subscription 3d276f7e-0783-4581-8a49-ad0a2c432c63 \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Deploy with Helm (rolling restart)
        run: |
          kubectl rollout restart deployment/socket-server -n default
          kubectl rollout status deployment/socket-server -n default --timeout=5m

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **socket-server** deployado en Azure — commit \`${{ github.sha }}\` por **${{ github.actor }}**\"}"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **Deploy falló** en socket-server — commit \`${{ github.sha }}\` por **${{ github.actor }}** — revisar logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
