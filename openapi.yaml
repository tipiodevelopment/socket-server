  '/api/broadcasts/{broadcastId}/lineup':
    get:
      tags:
        - Dashboard - Lineups
      summary: Get broadcast lineup (dashboard)
      description: 'Returns the starting XI for home and away teams linked via `sportmonksFixtureId`. Cached 30 min (`cacheType = ''lineup_{fixtureId}''`). Team IDs from `broadcasts.metadata.homeTeamId/awayTeamId`. Returns `{ available: false }` when lineup not yet published (~60 min before kickoff).'
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lineup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  home:
                    $ref: '#/components/schemas/LineupTeam'
                  away:
                    $ref: '#/components/schemas/LineupTeam'
        '404':
          description: Broadcast not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/broadcasts/{broadcastId}/polls':
    get:
      tags:
        - Dashboard - Broadcasts
      summary: List broadcast polls
      description: Retrieves all polls for a broadcast (dashboard endpoint).
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poll'
        '500':
