          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Dashboard - Broadcasts
      summary: Create poll
      description: Creates a poll for a broadcast (dashboard endpoint).
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePollInput'
      responses:
        '201':
          description: Poll created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/broadcasts/{broadcastId}/send-lineup':
    post:
      tags:
        - Dashboard - Lineups
      summary: Send lineup_show WebSocket event
      description: 'Triggers a `lineup_show` WS event to all SDK clients on the campaign channel. Requires `showLineup = true` and a linked `sportmonksFixtureId`. `videoTimestamp = max(0, kickoffVideoTimestamp - 600)` (10 min lead time).'
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  event:
                    type: object
                    properties:
                      type:
                        type: string
                        example: lineup_show
                      videoTimestamp:
                        type: integer
                        example: 1800
                      kickoffVideoTimestamp:
                        type: integer
                        example: 2400
                      broadcastId:
                        type: string
                      leadTimeSeconds:
                        type: integer
                        example: 600
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: showLineup disabled or no fixture linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
        '404':
          description: Broadcast not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/broadcasts/{broadcastId}/shoppable-ad':
    post:
      tags:
        - Shoppable Ads
      summary: 'Trigger a shoppable ad (Admin API, Bearer auth)'
      description: |
        Resolves product from Commerce GraphQL, persists a row in
        `shoppable_ad_activations` with `source='admin-api'`, and fans out a
        `shoppable_ad` WebSocket event to all clients on the campaign.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: broadcastId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                productId:
                  type: string
                sponsorId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppableAdDispatchResult'
        '400':
          description: Bad request (missing productId or broadcast has no campaign)
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Broadcast or campaign not found
  '/api/broadcasts/{broadcastId}/shoppable-ads':
    get:
      tags:
        - Shoppable Ads
        - Analytics
      summary: List shoppable ad activations for a broadcast
      description: |
        Returns activation history sorted by `triggeredAt` DESC. Useful for
        audit, debugging, and dashboard timelines.
      parameters:
        - in: path
          name: broadcastId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: sponsorId
          schema:
            type: integer
        - in: query
          name: source
          schema:
            type: string
            enum:
              - admin-api
              - dashboard
              - tv-sdk
              - slot-scheduler
      responses:
        '200':
          description: List of activations
          content:
            application/json:
              schema:
                type: object
                properties:
                  activations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppableAdActivation'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  count:
                    type: integer
  '/api/broadcasts/{broadcastId}/sponsor-slots/{slotId}/execute':
    post:
      tags:
        - Shoppable Ads
        - Dashboard - Broadcasts
      summary: Execute a pre-configured sponsor slot
      description: |
        Fires a scheduled shoppable_ad dispatch for a pre-configured
        `broadcast_sponsor_slot`. Persists with `source='slot-scheduler'` and
        populates `slotId`. On success, marks the slot row as completed
        (`status='completed'`, `executedAt=now()`). The activation is written
        before the slot status update, so the slot will never be marked
        completed without a matching activation row.
      parameters:
        - in: path
          name: broadcastId
          required: true
          schema:
            type: string
        - in: path
          name: slotId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppableAdDispatchResult'
        '404':
          description: Slot
          broadcast or campaign not found: null
  '/api/broadcasts/{broadcastId}/trigger-shoppable-ad':
    post:
      tags:
        - Shoppable Ads
      summary: 'Trigger a shoppable ad (Dashboard, no auth)'
      description: |
        Same as the Admin endpoint but without auth. Used by the dashboard UI.
        Persists with `source='dashboard'`.
      parameters:
        - in: path
          name: broadcastId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                productId:
                  type: string
                sponsorId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppableAdDispatchResult'
        '400':
          description: Bad request
        '404':
          description: Broadcast or campaign not found
