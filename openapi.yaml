openapi: 3.0.3
info:
  title: Vio API
  version: 1.0.0
  description: 'A comprehensive API for the Vio real-time event broadcasting and engagement platform. Includes Admin APIs for broadcast management, SDK APIs for mobile/web integration, Dashboard APIs for internal use, and Analytics APIs for data insights.'
servers:
  - url: /
tags:
  - name: Admin API - Broadcasts
    description: Broadcast management endpoints (Bearer auth required)
  - name: Admin API - Polls
    description: Poll management endpoints for broadcasts (Bearer auth required)
  - name: Admin API - Contests
    description: Contest management endpoints for broadcasts (Bearer auth required)
  - name: SDK - Discovery
    description: SDK auto-discovery and campaign lookup (API Key auth)
  - name: SDK - Configuration
    description: SDK and campaign configuration retrieval (API Key auth)
  - name: SDK - Engagement
    description: Public engagement endpoints for voting and contest participation (rate-limited)
  - name: SDK - Localization
    description: Localized string retrieval for SDK clients (API Key auth)
  - name: SDK - Offers
    description: Offer retrieval for SDK clients (API Key auth)
  - name: Dashboard - Users & Auth
    description: User management and authentication endpoints
  - name: Dashboard - Client Apps
    description: Client application management
  - name: Dashboard - Sponsors
    description: Sponsor management
  - name: Dashboard - Campaigns
    description: 'Campaign management, configuration, and lifecycle'
  - name: Dashboard - Broadcasts
    description: 'Dashboard broadcast, poll, and contest management'
  - name: Dashboard - Components
    description: Component library and campaign component management
  - name: Dashboard - Events
    description: Event tracking and WebSocket event triggers
  - name: Dashboard - Objects
    description: File upload and object storage management
  - name: Dashboard - Lineups
    description: Lineup retrieval and lineup_show WebSocket trigger endpoints
  - name: SDK - Lineup
    description: Starting XI lineup retrieval for SDK clients (API Key auth)
  - name: SDK - TV
    description: 'Dedicated endpoints for TV SDKs (tvOS, Fire TV, Roku) using the same API Key auth as mobile SDKs but isolated under `/api/sdk/tv/*`'
  - name: SDK v2
    description: v2 SDK endpoints for the multi-sponsor model. Mobile SDK bootstrap + per-broadcast capabilities + per-broadcast components with sponsor-per-placement.
  - name: Shoppable Ads
    description: 'Triggering and auditing shoppable_ad activations (4 entry points, shared table `shoppable_ad_activations`)'
  - name: Cart Intents
    description: 'User click-to-buy events. Replaces fire-and-forget cart_intent with persistent rows carrying attribution (source_activation_id, source_component_id).'
  - name: Secondary Sponsors
    description: Manage the list of secondary sponsors for a campaign. Primary sponsor lives on campaign.primary_sponsor_id and is immutable once child rows exist.
  - name: Analytics
    description: Analytics and reporting endpoints (planned)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for Admin API endpoints (/v1/*)
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: API key passed as query parameter for SDK endpoints
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key passed in header for SDK endpoints
    BundleIdHeader:
      type: apiKey
      in: header
      name: X-App-Bundle-ID
      description: Bundle ID in header for SDK auto-discovery
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        reachuUserId:
          type: string
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        firebaseToken:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    InsertUser:
      type: object
      required:
        - reachuUserId
      properties:
        reachuUserId:
          type: string
        email:
          type: string
        name:
          type: string
        firebaseToken:
          type: string
    ClientApp:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        bundleId:
          type: string
        apiKey:
          type: string
        reachuApiKey:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - inactive
        iconUrl:
          type: string
          nullable: true
        bannerUrl:
          type: string
          nullable: true
        webhookUrl:
          type: string
          nullable: true
        partnerDeviceRegisterUrl:
          type: string
          nullable: true
          description: 'URL where Vio POSTs userId, deviceToken, platform after SDK register-device'
        createdAt:
          type: string
          format: date-time
    InsertClientApp:
      type: object
      required:
        - userId
        - name
        - bundleId
        - apiKey
      properties:
        userId:
          type: integer
        name:
          type: string
        bundleId:
          type: string
        apiKey:
          type: string
        reachuApiKey:
          type: string
        description:
          type: string
        status:
          type: string
        iconUrl:
          type: string
        bannerUrl:
          type: string
        webhookUrl:
          type: string
          nullable: true
        partnerDeviceRegisterUrl:
          type: string
          nullable: true
    Channel:
      type: object
      properties:
        id:
          type: integer
        clientAppId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        dynamicConfig:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
    Sponsor:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        primaryColor:
          type: string
          nullable: true
        secondaryColor:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    InsertSponsor:
      type: object
      required:
        - userId
        - name
      properties:
        userId:
          type: integer
        name:
          type: string
        description:
          type: string
        logoUrl:
          type: string
        avatarUrl:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
    Campaign:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        clientAppId:
          type: integer
          nullable: true
        channelId:
          type: integer
          nullable: true
        sponsorId:
          type: integer
          nullable: true
        name:
          type: string
        logo:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        isPaused:
          type: string
          enum:
            - 'true'
            - 'false'
        matchId:
          type: string
          nullable: true
        matchName:
          type: string
          nullable: true
        matchStartTime:
          type: string
          format: date-time
          nullable: true
        brandName:
          type: string
          nullable: true
        brandIconAsset:
          type: string
          nullable: true
        brandIconUrl:
          type: string
          nullable: true
        brandLogoUrl:
          type: string
          nullable: true
        isSegmented:
          type: string
          enum:
            - 'true'
            - 'false'
        targetCountries:
          type: array
          items:
            type: string
          nullable: true
        targetPercentage:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    InsertCampaign:
      type: object
      required:
        - userId
        - name
      properties:
        userId:
          type: integer
        clientAppId:
          type: integer
        channelId:
          type: integer
        sponsorId:
          type: integer
        name:
          type: string
        logo:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isPaused:
          type: string
        matchId:
          type: string
        matchName:
          type: string
        matchStartTime:
          type: string
          format: date-time
        brandName:
          type: string
        brandIconAsset:
          type: string
        brandIconUrl:
          type: string
        brandLogoUrl:
          type: string
        isSegmented:
          type: string
        targetCountries:
          type: array
          items:
            type: string
        targetPercentage:
          type: integer
    UpdateCampaign:
      type: object
      properties:
        name:
          type: string
        logo:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        isPaused:
          type: string
        matchId:
          type: string
          nullable: true
        matchName:
          type: string
          nullable: true
        matchStartTime:
          type: string
          format: date-time
          nullable: true
        isSegmented:
          type: string
        targetCountries:
          type: array
          items:
            type: string
          nullable: true
        targetPercentage:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
    Broadcast:
      type: object
      properties:
        broadcastId:
          type: string
        broadcastName:
          type: string
        description:
          type: string
          nullable: true
        campaignId:
          type: integer
          nullable: true
        channelId:
          type: integer
          nullable: true
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - upcoming
            - live
            - ended
        metadata:
          type: object
          nullable: true
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InsertBroadcast:
      type: object
      required:
        - broadcastName
      properties:
        broadcastName:
          type: string
        description:
          type: string
        campaignId:
          type: integer
        channelId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        metadata:
          type: object
    Poll:
      type: object
      properties:
        id:
          type: integer
        broadcastId:
          type: string
        question:
          type: string
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        totalVotes:
          type: integer
        videoStartTime:
          type: integer
          nullable: true
        videoEndTime:
          type: integer
          nullable: true
        broadcastStartTime:
          type: string
          format: date-time
          nullable: true
        scheduledStartTime:
          type: string
          format: date-time
          nullable: true
        scheduledEndTime:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: '#/components/schemas/PollOption'
    PollOption:
      type: object
      properties:
        id:
          type: integer
        pollId:
          type: integer
        text:
          type: string
        voteCount:
          type: integer
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreatePollInput:
      type: object
      required:
        - question
        - options
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isActive:
          type: boolean
        videoStartTime:
          type: integer
        videoEndTime:
          type: integer
        broadcastStartTime:
          type: string
          format: date-time
    PollVote:
      type: object
      properties:
        id:
          type: integer
        pollId:
          type: integer
        optionId:
          type: integer
        userId:
          type: string
        broadcastId:
          type: string
        createdAt:
          type: string
          format: date-time
    VoteInput:
      type: object
      required:
        - optionId
        - userId
        - broadcastId
      properties:
        optionId:
          type: integer
        userId:
          type: string
        broadcastId:
          type: string
    PollResults:
      type: object
      properties:
        poll:
          $ref: '#/components/schemas/Poll'
        results:
          type: array
          items:
            type: object
            properties:
              optionId:
                type: integer
              text:
                type: string
              voteCount:
                type: integer
              percentage:
                type: number
                format: float
        totalVotes:
          type: integer
    Contest:
      type: object
      properties:
        id:
          type: integer
        broadcastId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        prize:
          type: string
          nullable: true
        contestType:
          type: string
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        videoStartTime:
          type: integer
          nullable: true
        videoEndTime:
          type: integer
          nullable: true
        broadcastStartTime:
          type: string
          format: date-time
          nullable: true
        scheduledStartTime:
          type: string
          format: date-time
          nullable: true
        scheduledEndTime:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateContestInput:
      type: object
      required:
        - title
        - contestType
      properties:
        title:
          type: string
        description:
          type: string
        prize:
          type: string
        contestType:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isActive:
          type: boolean
        videoStartTime:
          type: integer
        videoEndTime:
          type: integer
        broadcastStartTime:
          type: string
          format: date-time
    ContestParticipation:
      type: object
      properties:
        id:
          type: integer
        contestId:
          type: integer
        userId:
          type: string
        broadcastId:
          type: string
        answers:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
    ParticipateInput:
      type: object
      required:
        - userId
        - broadcastId
      properties:
        userId:
          type: string
        broadcastId:
          type: string
        answers:
          type: object
    Component:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        config:
          type: object
        isTemplate:
          type: string
          enum:
            - 'true'
            - 'false'
        createdAt:
          type: string
          format: date-time
    InsertComponent:
      type: object
      required:
        - type
        - name
        - config
      properties:
        type:
          type: string
        name:
          type: string
        config:
          type: object
        isTemplate:
          type: string
    CampaignComponent:
      type: object
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        componentId:
          type: string
        instanceName:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - inactive
        customConfig:
          type: object
          nullable: true
        scheduledTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
        matchId:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
    ScheduledComponent:
      type: object
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        type:
          type: string
        scheduledTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        data:
          type: object
        status:
          type: string
          enum:
            - pending
            - sent
            - cancelled
        createdAt:
          type: string
          format: date-time
    CampaignFeatureFlags:
      type: object
      properties:
        enableLiveStreaming:
          type: string
          enum:
            - 'true'
            - 'false'
        enableProductCatalog:
          type: string
          enum:
            - 'true'
            - 'false'
        enableEngagement:
          type: string
          enum:
            - 'true'
            - 'false'
        enablePolls:
          type: string
          enum:
            - 'true'
            - 'false'
        enableContests:
          type: string
          enum:
            - 'true'
            - 'false'
    CampaignEngagementConfig:
      type: object
      properties:
        demoMode:
          type: string
          enum:
            - 'true'
            - 'false'
        defaultPollDuration:
          type: integer
        defaultContestDuration:
          type: integer
        maxVotesPerPoll:
          type: integer
        maxContestsPerMatch:
          type: integer
        enableRealTimeUpdates:
          type: string
          enum:
            - 'true'
            - 'false'
        updateInterval:
          type: integer
    CampaignUiConfig:
      type: object
      properties:
        primaryColor:
          type: string
        secondaryColor:
          type: string
        componentConfigs:
          type: object
          nullable: true
    WebSocketEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - product
            - poll
            - contest
        data:
          type: object
        campaignLogo:
          type: string
          nullable: true
        timestamp:
          type: integer
    FormState:
      type: object
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        formType:
          type: string
        formData:
          type: object
        updatedAt:
          type: string
          format: date-time
    AnalyticsOverview:
      type: object
      properties:
        totalApps:
          type: integer
        totalCampaigns:
          type: integer
        totalBroadcasts:
          type: integer
        totalPolls:
          type: integer
        totalContests:
          type: integer
        totalVotes:
          type: integer
        totalParticipations:
          type: integer
        activeCampaigns:
          type: integer
    AnalyticsEngagement:
      type: object
      properties:
        totalVotes:
          type: integer
        totalParticipations:
          type: integer
        averageVotesPerPoll:
          type: number
        topCampaigns:
          type: array
          items:
            type: object
            properties:
              campaignId:
                type: integer
              name:
                type: string
              votes:
                type: integer
              participations:
                type: integer
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    LineupPlayer:
      type: object
      properties:
        id:
          type: integer
          description: Sportmonks player ID
        name:
          type: string
          example: Marc-André ter Stegen
        jerseyNumber:
          type: integer
          nullable: true
          example: 1
        position:
          type: string
          enum:
            - goalkeeper
            - defender
            - midfielder
            - attacker
          example: goalkeeper
    SdkV2Config:
      type: object
      description: v2 SDK bootstrap payload with primary + secondary sponsors
      properties:
        endpoints:
          type: object
          properties:
            webSocketBase:
              type: string
            commerceGraphQL:
              type: string
        campaign:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            logo:
              type: string
              nullable: true
            isActive:
              type: boolean
            isPaused:
              type: boolean
            startDate:
              type: string
              format: date-time
              nullable: true
            endDate:
              type: string
              format: date-time
              nullable: true
        primarySponsor:
          $ref: '#/components/schemas/SdkV2Sponsor'
        secondarySponsors:
          type: array
          items:
            $ref: '#/components/schemas/SdkV2Sponsor'
        features:
          type: object
          properties:
            shoppable:
              type: boolean
            lineup:
              type: boolean
    SdkV2Sponsor:
      type: object
      description: Sponsor block as emitted in v2 SDK config (with commerce keys)
      properties:
        id:
          type: integer
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: 'Square brand mark, rendered in the shoppable overlay / product card. Non-null for any sponsor eligible to dispatch shoppable_ad events.'
        logoUrl:
          type: string
          nullable: true
          description: 'Wide horizontal logo, for sponsor intros and full-screen branding. Not a fallback for avatarUrl.'
        primaryColor:
          type: string
          nullable: true
        secondaryColor:
          type: string
          nullable: true
        commerce:
          type: object
          nullable: true
          description: null = visual-only sponsor (no Commerce integration)
          properties:
            apiKey:
              type: string
            channelId:
              type: string
              nullable: true
            paymentMethods:
              type: array
              items:
                type: string
              description: 'e.g. [''card'', ''klarna'', ''vipps'', ''apple_pay'', ''google_pay'']'
    SdkV2ComponentPlacement:
      type: object
      description: 'Component assignment for a broadcast, with its sponsor + optional commerce block'
      properties:
        id:
          type: integer
        campaignComponentId:
          type: integer
        type:
          type: string
        locationId:
          type: string
          nullable: true
        instanceName:
          type: string
          nullable: true
        sponsor:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            avatarUrl:
              type: string
              nullable: true
              description: Square brand mark. Preferred for overlays.
            logoUrl:
              type: string
              nullable: true
            primaryColor:
              type: string
              nullable: true
        commerce:
          type: object
          nullable: true
          properties:
            apiKey:
              type: string
            channelId:
              type: string
              nullable: true
        config:
          type: object
    CartIntent:
      type: object
      description: Persisted row for a cart_intent dispatch
      properties:
        id:
          type: integer
        endUserId:
          type: integer
        campaignId:
          type: integer
        clientAppId:
          type: integer
        tvSessionId:
          type: integer
          nullable: true
        sponsorId:
          type: integer
          nullable: true
        productId:
          type: string
        sourceActivationId:
          type: integer
          nullable: true
        sourceComponentId:
          type: integer
          nullable: true
        deliveryMode:
          type: string
          enum:
            - websocket
            - dual
            - webhook
            - apns
            - dropped
        userConnected:
          type: boolean
        envelope:
          type: object
        metadata:
          type: object
          nullable: true
        triggeredAt:
          type: string
          format: date-time
    ShoppableAdActivation:
      type: object
      description: One dispatch of a shoppable_ad (persisted in `shoppable_ad_activations`)
      properties:
        id:
          type: integer
        broadcastId:
          type: string
        campaignId:
          type: integer
        sponsorId:
          type: integer
          nullable: true
        slotId:
          type: integer
          nullable: true
          description: Populated only for source='slot-scheduler'
        clientAppId:
          type: integer
          nullable: true
          description: Populated only for source='tv-sdk' (or future API-key-auth entry points)
        productId:
          type: string
          description: External Commerce product id
        productSnapshot:
          type: object
          description: 'Product state captured at dispatch time (id, name, price, currency, imageUrl)'
        sponsorSnapshot:
          type: object
          nullable: true
          description: 'Sponsor state captured at dispatch time (name, logoUrl, primaryColor)'
        source:
          type: string
          enum:
            - admin-api
            - dashboard
            - tv-sdk
            - slot-scheduler
        wsEventSent:
          type: boolean
          description: false if the DB insert succeeded but the subsequent WS broadcast threw
        metadata:
          type: object
          nullable: true
        triggeredAt:
          type: string
          format: date-time
    ShoppableAdDispatchResult:
      type: object
      properties:
        success:
          type: boolean
        activationId:
          type: integer
          description: Primary key of the persisted activation row; can be echoed back in a future cart_intent for attribution
        product:
          type: object
        sponsor:
          type: object
          nullable: true
    LineupTeam:
      type: object
      properties:
        teamName:
          type: string
          nullable: true
          example: FC Barcelona
        formation:
          type: string
          nullable: true
          example: 4-3-3
        players:
          type: array
          items:
            $ref: '#/components/schemas/LineupPlayer'
paths:
