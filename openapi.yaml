    put:
      tags:
        - Dashboard - Objects
      summary: Update campaign logo
      description: Uploads and sets a campaign logo image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - campaignId
              properties:
                file:
                  type: string
                  format: binary
                campaignId:
                  type: integer
      responses:
        '200':
          description: Logo updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/campaigns:
    get:
      tags:
        - Dashboard - Campaigns
      summary: List campaigns
      description: Retrieves all campaigns.
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Dashboard - Campaigns
      summary: Create campaign
      description: Creates a new campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertCampaign'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/campaigns/{campaignId}/cart-intent':
    post:
      tags:
        - Dashboard - Campaigns
      summary: Cart intent (second screen / shoppable)
      description: |
        Triggers cart intent for a user: if the campaign has `webhookUrl`, Vio POSTs a canonical JSON body to that URL (partner sends push). Otherwise, when APNs and a device token are configured, Vio may send a demo push.

        **Partner webhook body** includes `vio_notification_version`, `vio_event_type`, `userId`, `productId`, `campaignId`, `action`, optional `productName`.

        **APNs / app `userInfo` (when partner pushes):** include the same envelope plus `vio_cartIntent_*` keys — see Vio Swift SDK `VioNotificationUserInfoKeys` and `CartIntentNotificationKeys`.
      security:
        - ApiKeyQuery: []
        - ApiKeyHeader: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - productId
              properties:
                userId:
                  type: string
                  description: Must match SDK/WebSocket user id
                productId:
                  type: string
                productName:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Processed — webhook called and/or push attempted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mode:
                    type: string
                    enum:
                      - webhook
                  note:
                    type: string
                    description: 'e.g. no_device_registered, apns_not_configured'
        '400':
          description: Bad request
        '401':
          description: API key required or invalid
