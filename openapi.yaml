        - mobile-sdk
      summary: APNs/FCM token registration.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: Campaign id.
      responses:
        '200':
          description: Success
        '401':
          description: Auth missing/invalid
  /v2/mobile/components/manifest:
    post:
      tags:
        - mobile-sdk
      summary: 'Cold-start manifest upload — body { locations: [{id, displayName?}, …] }. Sync semantics: locations not in payload get deprecated_at = now().'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      displayName:
                        type: string
                    required:
                      - id
              required:
                - locations
      responses:
        '200':
          description: Manifest accepted; counts of upserts/deprecations returned.
        '400':
          description: 'Body contains legacy `placements[]` or `components[]` arrays.'
